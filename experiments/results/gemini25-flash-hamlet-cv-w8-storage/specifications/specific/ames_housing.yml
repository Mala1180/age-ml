# AGE-ML ablation study -- Dataset-specific specification
# Generated by `python -m experiments.ablation.specifications`.
# Do not edit by hand: change the generator and regenerate.
#
# variant : specific
# base    : resources/general-specification.yml
# dataset : ames_housing (regression, target 'SalePrice')
#
# dataset meta-features:
#   instances       = 1460
#   features        = 80 (37 numeric, 43 categorical)
#   missing values  = 6.7029%
#   max |skewness|  = 24.48
#   imbalance ratio = 1.00
#
# specialization:
#   [regression] mandatory: the task is known to be regression
#   [classification] dropped: the dataset poses a regression problem
#   [rebalancing] dropped: rebalancing is not defined for a numeric target
#   [features] 'select_k_best' re-parametrized: with 80 input features, k is scaled to [8, 20] (about a tenth and a quarter of them)
#   [discretization] dropped: binning 80 > 50 features is prohibitive
#   [normalization] 'minmax' dropped: the largest absolute skewness is 24.48 >= 2.0, min-max scaling would be dominated by the outliers of the heavy-tailed features

budgets:
  pipelines: 30
  workers: 8
  generation_attempts: 10
  time:
    hours: 2
pipeline:
  defaults:
    candidates: []
    mandatory: false
  steps:
    imputation:
      candidates:
      - simple_imputer:
          params:
            imputation_strategy:
            - mean
            - median
      - iterative_imputer:
          params:
            max_iter:
            - 10
    normalization:
      candidates:
      - power_transformer:
          params:
            method:
            - yeo-johnson
      - robust_scaler:
          params:
            quantile_range:
            - - 25.0
              - 75.0
      - standard:
          params: {}
    features:
      candidates:
      - select_k_best:
          params:
            k:
            - 8
            - 20
      - pca:
          params:
            n_components:
            - 0.95
    regression:
      candidates:
      - linear:
          params: {}
      - ridge:
          params:
            alpha:
            - 1.0
            - 10.0
      - lasso:
          params:
            alpha:
            - 0.01
            - 0.1
      - elastic_net:
          params:
            alpha:
            - 0.01
            l1_ratio:
            - 0.5
      - svr:
          params:
            kernel:
            - rbf
            C:
            - 1.0
            - 10.0
            epsilon:
            - 0.1
      - knn_regressor:
          params:
            n_neighbors:
            - 5
            - 11
            weights:
            - distance
      - random_forest_regressor:
          params:
            n_estimators:
            - 200
            max_depth:
            - null
            - 20
      - nn_regressor:
          params:
            hidden_layer_sizes:
            - - 10
            - - 20
            alpha:
            - 0.001
            max_iter:
            - 300
      mandatory: true
ordering:
- sequence:
  - imputation
  - normalization
  - features
  - regression
constraints:
- if:
    step:
      regression: linear
  require:
  - normalization
- if:
    step:
      regression: ridge
  require:
  - normalization
- if:
    step:
      regression: lasso
  require:
  - normalization
- if:
    step:
      regression: elastic_net
  require:
  - normalization
- if:
    step:
      regression: svr
  require:
  - normalization
- if:
    step:
      regression: knn_regressor
  require:
  - normalization
  - features
- if:
    step:
      regression: nn_regressor
  require:
  - normalization
- if:
    step:
      regression: random_forest_regressor
  forbid:
  - normalization
- if:
    step:
      features: pca
  require:
  - normalization
- if:
    step:
      imputation: iterative_imputer
  require:
  - normalization
technical_details:
- use Python for the implementation
- use scikit-learn for the ML algorithms (using Pipeline class if possible)
