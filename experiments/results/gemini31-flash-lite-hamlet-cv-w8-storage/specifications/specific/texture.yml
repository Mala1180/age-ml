# AGE-ML ablation study -- Dataset-specific specification
# Generated by `python -m experiments.ablation.specifications`.
# Do not edit by hand: change the generator and regenerate.
#
# variant : specific
# base    : resources/general-specification.yml
# dataset : texture (classification, target 'Class')
#
# dataset meta-features:
#   instances       = 5500
#   features        = 40 (40 numeric, 0 categorical)
#   missing values  = 0.0000%
#   max |skewness|  = 2.67
#   imbalance ratio = 1.00 over 11 classes
#
# specialization:
#   [classification] mandatory: the task is known to be classification
#   [regression] dropped: the dataset poses a classification problem
#   [imputation] dropped: the dataset has no missing value
#   [rebalancing] dropped: the imbalance ratio is 1.00 < 1.5, resampling is not warranted
#   [features] 'select_k_best' re-parametrized: with 40 input features, k is scaled to [5, 10] (about a tenth and a quarter of them)
#   [normalization] 'minmax' dropped: the largest absolute skewness is 2.67 >= 2.0, min-max scaling would be dominated by the outliers of the heavy-tailed features

budgets:
  pipelines: 30
  workers: 8
  generation_attempts: 10
  time:
    hours: 2
pipeline:
  defaults:
    candidates: []
    mandatory: false
  steps:
    discretization:
      candidates:
      - kbins:
          params:
            n_bins:
            - 10
            encode:
            - ordinal
            discretization_strategy:
            - quantile
      - binarizer:
          params:
            threshold:
            - 0.0
    normalization:
      candidates:
      - power_transformer:
          params:
            method:
            - yeo-johnson
      - robust_scaler:
          params:
            quantile_range:
            - - 25.0
              - 75.0
      - standard:
          params: {}
    features:
      candidates:
      - select_k_best:
          params:
            k:
            - 5
            - 10
      - pca:
          params:
            n_components:
            - 0.95
    classification:
      candidates:
      - decision_tree:
          params:
            max_depth:
            - null
            - 10
            min_samples_split:
            - 2
            - 5
      - knn:
          params:
            n_neighbors:
            - 5
            - 11
            weights:
            - uniform
            - distance
      - naive_bayes:
          params:
            var_smoothing:
            - 1e-9
      - nn:
          params:
            hidden_layer_sizes:
            - - 10
            - - 20
            alpha:
            - 0.001
            max_iter:
            - 300
      - random_forest:
          params:
            n_estimators:
            - 200
            max_depth:
            - null
            - 20
      - ada_boost:
          params:
            n_estimators:
            - 100
            learning_rate:
            - 0.1
      mandatory: true
ordering:
- sequence:
  - discretization
  - normalization
  - features
  - classification
constraints:
- if:
    step:
      classification: decision_tree
  forbid:
  - normalization
  - features
- if:
    step:
      classification: random_forest
  forbid:
  - normalization
- if:
    step:
      classification: knn
  require:
  - normalization
  - features
- if:
    step:
      classification: nn
  require:
  - normalization
  forbid:
  - discretization
- if:
    step:
      classification: naive_bayes
  forbid:
  - normalization
- if:
    step:
      classification: ada_boost
  forbid:
  - normalization
- if:
    step:
      features: pca
  require:
  - normalization
- if:
    step:
      features: select_k_best
  forbid:
  - discretization
technical_details:
- use Python for the implementation
- use scikit-learn for the ML algorithms (using Pipeline class if possible)
