# AGE-ML ablation study -- Dataset-specific specification
# Generated by `python -m experiments.ablation.specifications`.
# Do not edit by hand: change the generator and regenerate.
#
# variant : specific
# base    : resources/general-specification.yml
# dataset : adult (classification, target 'class')
#
# dataset meta-features:
#   instances       = 48842
#   features        = 14 (6 numeric, 8 categorical)
#   missing values  = 0.9455%
#   max |skewness|  = 11.89
#   imbalance ratio = 3.18 over 2 classes
#
# specialization:
#   [classification] mandatory: the task is known to be classification
#   [regression] dropped: the dataset poses a classification problem
#   [features] dropped: 14 < 20 input features leave nothing worth selecting or extracting
#   [discretization] dropped: only 6/14 input features are numeric, so there is little to discretize
#   [normalization] 'minmax' dropped: the largest absolute skewness is 11.89 >= 2.0, min-max scaling would be dominated by the outliers of the heavy-tailed features

budgets:
  pipelines: 30
  workers: 8
  generation_attempts: 10
  time:
    hours: 2
pipeline:
  defaults:
    candidates: []
    mandatory: false
  steps:
    imputation:
      candidates:
      - simple_imputer:
          params:
            imputation_strategy:
            - mean
            - median
      - iterative_imputer:
          params:
            max_iter:
            - 10
    normalization:
      candidates:
      - power_transformer:
          params:
            method:
            - yeo-johnson
      - robust_scaler:
          params:
            quantile_range:
            - - 25.0
              - 75.0
      - standard:
          params: {}
    rebalancing:
      candidates:
      - near_miss:
          params:
            version:
            - 1
      - smote:
          params:
            k_neighbors:
            - 5
    classification:
      candidates:
      - decision_tree:
          params:
            max_depth:
            - null
            - 10
            min_samples_split:
            - 2
            - 5
      - knn:
          params:
            n_neighbors:
            - 5
            - 11
            weights:
            - uniform
            - distance
      - naive_bayes:
          params:
            var_smoothing:
            - 1e-9
      - nn:
          params:
            hidden_layer_sizes:
            - - 10
            - - 20
            alpha:
            - 0.001
            max_iter:
            - 300
      - random_forest:
          params:
            n_estimators:
            - 200
            max_depth:
            - null
            - 20
      - ada_boost:
          params:
            n_estimators:
            - 100
            learning_rate:
            - 0.1
      mandatory: true
ordering:
- sequence:
  - imputation
  - normalization
  - rebalancing
  - classification
constraints:
- if:
    step:
      classification: decision_tree
  forbid:
  - normalization
- if:
    step:
      classification: random_forest
  forbid:
  - normalization
- if:
    step:
      classification: knn
  require:
  - normalization
- if:
    step:
      classification: nn
  require:
  - normalization
- if:
    step:
      classification: naive_bayes
  forbid:
  - normalization
- if:
    step:
      classification: ada_boost
  forbid:
  - normalization
- if:
    step:
      rebalancing: smote
  require:
  - imputation
- if:
    step:
      imputation: iterative_imputer
  require:
  - normalization
technical_details:
- use Python for the implementation
- use scikit-learn for the ML algorithms (using Pipeline class if possible)
