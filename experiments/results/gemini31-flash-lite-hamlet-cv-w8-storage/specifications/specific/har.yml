# AGE-ML ablation study -- Dataset-specific specification
# Generated by `python -m experiments.ablation.specifications`.
# Do not edit by hand: change the generator and regenerate.
#
# variant : specific
# base    : resources/general-specification.yml
# dataset : har (classification, target 'Class')
#
# dataset meta-features:
#   instances       = 10299
#   features        = 561 (561 numeric, 0 categorical)
#   missing values  = 0.0000%
#   max |skewness|  = 14.03
#   imbalance ratio = 1.38 over 6 classes
#
# specialization:
#   [classification] mandatory: the task is known to be classification
#   [regression] dropped: the dataset poses a classification problem
#   [imputation] dropped: the dataset has no missing value
#   [rebalancing] dropped: the imbalance ratio is 1.38 < 1.5, resampling is not warranted
#   [features] 'select_k_best' re-parametrized: with 561 input features, k is scaled to [57, 141] (about a tenth and a quarter of them)
#   [discretization] dropped: binning 561 > 50 features is prohibitive
#   [normalization] 'minmax' dropped: the largest absolute skewness is 14.03 >= 2.0, min-max scaling would be dominated by the outliers of the heavy-tailed features
#   [classification] 'knn' dropped: with 10299 x 561 cells, instance- and kernel-based learners do not fit the time budget

budgets:
  pipelines: 30
  workers: 8
  generation_attempts: 10
  time:
    hours: 2
pipeline:
  defaults:
    candidates: []
    mandatory: false
  steps:
    normalization:
      candidates:
      - power_transformer:
          params:
            method:
            - yeo-johnson
      - robust_scaler:
          params:
            quantile_range:
            - - 25.0
              - 75.0
      - standard:
          params: {}
    features:
      candidates:
      - select_k_best:
          params:
            k:
            - 57
            - 141
      - pca:
          params:
            n_components:
            - 0.95
    classification:
      candidates:
      - decision_tree:
          params:
            max_depth:
            - null
            - 10
            min_samples_split:
            - 2
            - 5
      - naive_bayes:
          params:
            var_smoothing:
            - 1e-9
      - nn:
          params:
            hidden_layer_sizes:
            - - 10
            - - 20
            alpha:
            - 0.001
            max_iter:
            - 300
      - random_forest:
          params:
            n_estimators:
            - 200
            max_depth:
            - null
            - 20
      - ada_boost:
          params:
            n_estimators:
            - 100
            learning_rate:
            - 0.1
      mandatory: true
ordering:
- sequence:
  - normalization
  - features
  - classification
constraints:
- if:
    step:
      classification: decision_tree
  forbid:
  - normalization
  - features
- if:
    step:
      classification: random_forest
  forbid:
  - normalization
- if:
    step:
      classification: nn
  require:
  - normalization
- if:
    step:
      classification: naive_bayes
  forbid:
  - normalization
- if:
    step:
      classification: ada_boost
  forbid:
  - normalization
- if:
    step:
      features: pca
  require:
  - normalization
technical_details:
- use Python for the implementation
- use scikit-learn for the ML algorithms (using Pipeline class if possible)
