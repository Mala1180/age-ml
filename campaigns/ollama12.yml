name: ollama12-paper
model:
  provider: ollama
  name: CHANGE_ME_MODEL_TAG
  base_url: http://192.168.15.12:11434
  api_key_env: OLLAMA_12_API_KEY
specification: resources/general-specification.yml
output_dir: experiments/results/ollama12-paper
repetitions: [1, 2, 3, 4, 5]
split_seed: 42
baseline: true
ablations:
  # The baseline is the general specification; do not duplicate it here.
  specification: [poor, specific]
  validation: [no-semantic-retry, no-execution-retry]
  no_csp: true
# Omit datasets to use all nine datasets. For an initial campaign, uncomment:
